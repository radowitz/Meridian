name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd)"
      - name: go vet
        run: go vet ./...
      - name: Go tests
        run: |
          set -o pipefail
          if ! go test ./... -count=1 2>&1 | tee /tmp/go-test.log; then
            # One multi-line annotation per failing package (GitHub keeps only 10 per step).
            awk '/^(=== RUN|--- FAIL|FAIL|panic:)/ || /_test\.go:[0-9]+:/ {keep=40} keep>0 {print; keep--}' /tmp/go-test.log | head -400 > /tmp/go-fail.txt
            split -l 60 /tmp/go-fail.txt /tmp/go-fail.part.
            for p in /tmp/go-fail.part.*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$p" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=go test::${msg}"
            done
            exit 1
          fi
      - name: Go build
        run: go build -o /dev/null ./cmd/meridian
      - name: Shell scripts (bash -n, shellcheck)
        run: |
          for f in deploy/*.sh deploy/debian/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning deploy/debian/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Panel tests and build
        working-directory: web
        run: npm ci && npx vitest run && npm run build
