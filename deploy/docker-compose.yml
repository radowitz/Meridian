# Host networking is required so the controller can install WireGuard and nftables
# into the Debian host. The process still binds only MERIDIAN_BIND (LAN address).
# Mesh is intentionally not defined here. It does not run on the home gateway.
# The hub's generated bundle has etc/meridian/mesh-sidecar.compose.yml instead.
services:
  meridian:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - meridian-data:/var/lib/meridian
      - /etc/wireguard:/etc/wireguard
      - /etc/nftables.d:/etc/nftables.d
      - /etc/sysctl.d:/etc/sysctl.d
      - /etc/smartdns:/etc/smartdns
      - /etc/meridian:/etc/meridian
      - /etc/systemd/system:/etc/systemd/system
      - /etc/iproute2/rt_tables.d:/etc/iproute2/rt_tables.d
      - /usr/local/sbin:/usr/local/sbin
    environment:
      MERIDIAN_BIND: 192.168.100.88:8787
      MERIDIAN_DATA: /var/lib/meridian
      MERIDIAN_WEB_DIR: /usr/share/meridian/web
    restart: unless-stopped

  # Optional. Enable after /etc/smartdns/smartdns.conf exists:
  #   docker compose --profile dns up -d
  # Pin the image digest before production; do not rely on :latest long-term.
  smartdns:
    profiles: ["dns"]
    image: pymumu/smartdns:latest
    network_mode: host
    volumes:
      - /etc/smartdns:/etc/smartdns:ro
    restart: unless-stopped
    command: ["-f", "-c", "/etc/smartdns/smartdns.conf"]

volumes:
  meridian-data:
