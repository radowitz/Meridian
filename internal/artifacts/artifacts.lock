# Meridian panel-delivered binaries: the one place their versions and
# digests are pinned. deploy/Dockerfile (deploy/fetch-artifacts.sh) reads
# this file at image build time and the panel embeds it (catalog.go), so the
# build and the running panel can never disagree about what is acceptable.
#
# Columns (whitespace separated):
#   name version arch binary_sha256 binary_size source_sha256 source_kind member url
#
#   arch           uname -m of the target host (x86_64, aarch64)
#   binary_sha256  SHA-256 of the executable as installed on the host
#   source_sha256  SHA-256 of the upstream download (the release archive, or
#                  the binary itself when source_kind is "raw")
#   source_kind    tar.gz (extract member) | raw (the download is the binary)
#
